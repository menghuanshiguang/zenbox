# zenbox CI

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            arch: arm64
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.arch && format('{0}-{1}', matrix.os, matrix.arch) || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install ripgrep（L0 禁词门禁用；runner 镜像未预装）
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux)  sudo apt-get update -q && sudo apt-get install -y ripgrep ;;
            Darwin) brew install ripgrep ;;
            *)      choco install ripgrep -y ;;
          esac
          rg --version | head -n 1
      - name: Install devDependencies（仅 typescript，红线②）
        run: npm ci
      - name: L0 + L1 + L2 门禁
        run: npm test
      - name: 内置 mihomo（按 pin 版本拉当前平台 + -v 冒烟）
        shell: bash
        run: node scripts/fetch-mihomo.mjs --smoke
      - name: start 冒烟（三平台脚本直跑，banner 出现后优雅退出）
        shell: bash
        run: |
          set -euo pipefail
          node start.js status --json > smoke.json
          grep -q '"version": "0.1.0"' smoke.json
          if [ "$RUNNER_OS" = "Windows" ]; then
            OFM_SMOKE_MS=2000 cmd //c "start.cmd > smoke-start.log 2>&1"
          else
            OFM_SMOKE_MS=2000 ./start.sh > smoke-start.log 2>&1
          fi
          grep -q 'zenbox v0.1.0' smoke-start.log
          grep -q '本机转发' smoke-start.log
